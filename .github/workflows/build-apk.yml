name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Generate Release Keystore and Build APKs
        run: |
          keytool -genkey -v -keystore android/app/release.jks -alias mo360 -keyalg RSA -keysize 2048 -validity 10000 -storepass mo360pass -keypass mo360pass -dname "CN=Mo360, OU=Studio, O=Mo360 Immersive Studio, L=Plymouth, ST=Devon, C=GB"
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Copy Release APK to docs for direct web download
        run: |
          mkdir -p docs/apk
          cp android/app/build/outputs/apk/release/app-release.apk docs/apk/mo360-virtual-tour.apk
          cp android/app/build/outputs/apk/release/app-release.apk docs/apk/mo360-virtual-tour-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk docs/apk/mo360-virtual-tour-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/apk/
          git diff --staged --quiet || git commit -m "deploy: update release and debug apks [skip ci]"
          git push || true

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mo360-virtual-tour-apks
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "Mo360 Virtual Tour Platform - Android APK v1.0.0"
          body: "Direct APK downloads for Pixel 9 Pro / Android 10+ devices with Ricoh Theta OSC Wi-Fi auto-binding and CapacitorHttp socket routing."
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
