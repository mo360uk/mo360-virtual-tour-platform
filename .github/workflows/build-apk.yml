name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Copy APK to docs for direct web download
        run: |
          mkdir -p docs/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk docs/apk/mo360-virtual-tour.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/apk/mo360-virtual-tour.apk
          git diff --staged --quiet || git commit -m "deploy: update mo360-virtual-tour.apk [skip ci]"
          git push || true

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mo360-virtual-tour-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "Mo360 Virtual Tour Platform - Android APK v1.0.0"
          body: "Direct APK download for Pixel 9 Pro / Android 10+ devices with Ricoh Theta OSC Wi-Fi auto-binding support."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
